<div class="sheet"><div id="sh"><div class="grab" id="gr"></div><div id="res"></div></div></div>${tabs()}</div>`}

function draw(){const L=list(),m=$('#map'),r=$('#res');if(!m)return;m.querySelectorAll('.pin').forEach(e=>e.remove());
L.forEach((p,i)=>{const e=document.createElement('div');e.className='pin'+(S.sel==p[0]?' sel':'');e.style.cssText=`left:${p[6]}%;top:${p[7]}%;--c:${C[p[10]]};animation-delay:${i*.08}s`;e.innerHTML=`<span>${inr(p[4])}</span>`;e.onclick=()=>{S.sel=p[0];draw();$('#c'+p[0])?.scrollIntoView({behavior:'smooth',block:'nearest'})};m.appendChild(e)});
r.innerHTML=Array(3).fill('<div class="sk"></div>').join('');
setTimeout(()=>{r.innerHTML=`<b>${L.length} spaces nearby</b><span style="color:var(--mut)"> · ${mine()} · sample availability</span>${P.filter(p=>!fits(p)).length?`<div class="tag" style="margin:6px 0 0">🚫 ${P.filter(p=>!fits(p)).length} too-small spaces hidden for your ${mine()}</div>`:''}<div style="height:10px"></div>`+(L.length?L.map((p,i)=>`<div class="card pc" id="c${p[0]}" style="animation-delay:${i*.07}s;${S.sel==p[0]?'border-color:var(--acc)':''}" onclick="S.sel=${p[0]};go('detail',{id:${p[0]}})"><div class="ph" style="--a:#1E3A8A;--b:#3B82F6">${p[16]}</div><div style="flex:1;min-width:0"><b>${p[1]}</b><div style="font-size:12px;color:var(--mut)">${p[3]}, Bengaluru · ${p[15]} km · ⭐ ${p[5]}</div><div style="margin:5px 0"><span class=tag style="background:#16A34A;color:#fff">✓ Fits · ${dim(p)[0]}×${dim(p)[1]} m</span>${p[11]?'<span class=tag>Covered</span>':'<span class=tag>Open</span>'}${p[12]?'<span class=tag>CCTV</span>':''}${p[13]?'<span class=tag>EV</span>':''}${p[14]?'<span class=tag style="background:#16A34A;color:#fff">Instant</span>':''}</div><div style="display:flex;justify-content:space-between;align-items:center"><b>${inr(p[4])}<small style="color:var(--mut)">/hr</small></b><span class="btn" style="min-height:34px;padding:6px 14px;font-size:13px">Book now</span></div></div></div>`).join(''):'<div class="empty"><big>🚗</big>No spaces match. Try removing a filter.</div>')},550)}
function sheetDrag(){const g=$('#gr'),s=$('#sh');if(!g)return;let y0=null,dy=0;g.onpointerdown=e=>{y0=e.clientY;g.setPointerCapture(e.pointerId);s.style.transition='none'};g.onpointermove=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);s.style.transform=`translateY(${dy}px)`};g.onpointerup=()=>{s.style.transition='';s.style.transform=dy>90?'translateY(calc(100% - 44px))':'';s.dataset.closed=dy>90?1:'';y0=null;dy=0};g.onclick=()=>{if(s.dataset.closed){s.style.transform='';s.dataset.closed=''}}}
 
function detail(){const p=sp(S.id),h=S.dur>=720?10:S.dur;S.start=S.start||'10:00';const st=['09:00','10:00','11:00','12:00','13:00','14:00'];
return `<div class="app" style="animation:su .4s both"><div class="gal">${['#1E3A8A,#3B82F6','#0F766E,#16A34A','#B45309,#F59E0B'].map(c=>`<div style="background:linear-gradient(135deg,${c})">${p[16]}</div>`).join('')}</div>
<div class="hd" style="position:absolute;top:0"><button class="back" onclick="go('home')">←</button></div>

<div class="tag" style="background:#16A34A;color:#fff;margin-top:10px">✓ Fits your ${mine()} · space ${dim(p)[0]}×${dim(p)[1]} m</div><div style="margin:12px 0">${[['Covered',p[11]],['CCTV',p[12]],['EV charging',p[13]],['24/7 access',1],['Security guard',p[1].includes('Society')||p[2]=='Paid lot'],['Bike parking',1]].filter(a=>a[1]).map(a=>`<span class="tag">✓ ${a[0]}</span>`).join('')}</div>

<div class="map" style="height:110px;border-radius:18px;margin:12px 0"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 40L100 60M50 0L50 100" stroke="#fff" stroke-width="4" fill="none"/></svg><div class="pin" style="left:50%;top:60%;--c:#16A34A"><span>${inr(p[4])}</span></div></div>
<b>Start time</b><div class="slots" style="margin:8px 0 12px">${st.map((t,i)=>`<button class="slot ${S.start==t?'on':''} ${p[10]=='x'||i==3?'x':''}" onclick="pick('${t}',${p[10]=='x'||i==3})">${t}</button>`).join('')}</div>
<div id="na" style="display:none;color:var(--red);font-weight:700;margin-bottom:8px">⛔ Not available for this time</div>
<input id="vn" placeholder="Vehicle number e.g. KA 01 AB 1234" value="KA 01 AB 1234" style="margin-bottom:12px">
<div class="card pad">${(()=>{const x=price(p,h);return `<div class="line"><span>Parking fee (${h} hr)</span><span>${inr(x.fare)}</span></div><div class="line"><span>Platform fee (10%)</span><span>${inr(x.pf)}</span></div><div class="line"><span>GST on fee (18%)</span><span>${inr(x.gst)}</span></div><div class="line t"><span>Total</span><span id="tot" data-v="0"></span></div>`})()}</div>
<button class="btn g" id="rs" style="width:100%;margin-top:14px" onclick="reserve()">Reserve Space</button></div></div>`}
function pick(t,bad){S.start=t;if(bad){const b=$('#rs');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#na').style.display='block';S.bad=1;document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('on',s.textContent==t&&!bad));return}S.bad=0;$('#na').style.display='none';document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('on',s.textContent==t))}
function reserve(){if(S.bad||document.querySelector('.slot.x.on')||list&&P[S.id-1][10]=='x'){const b=$('#rs');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#na').style.display='block';return}S.vn=$('#vn').value;go('checkout')}
 
function checkout(){const p=sp(S.id),h=S.dur>=720?10:S.dur,x=price(p,h);S.x=x;return `<div class="app"><div class="hd"><button class="back" onclick="go('detail')">←</button><b>Checkout</b></div><div class="pad"><div class="card pad"><b>${p[1]}</b><div style="color:var(--mut);font-size:14px">${p[3]}, Bengaluru</div><div class="line"><span>Time</span><span>${S.start} · ${h} hr</span></div><div class="line"><span>Vehicle</span><span>${S.vn||'—'}</span></div><div class="line"><span>Parking + fees + GST</span><span>${inr(x.tot)}</span></div><p style="font-size:12px;color:var(--mut)">Cancellation: free up to 1 hour before start; 50% after.</p></div>
<h3 style="margin:16px 0 8px">Payment method</h3>${['UPI (GPay, PhonePe, Paytm)','Card','Wallet'].map((m,i)=>`<label class="card pad" style="display:flex;gap:10px;margin-bottom:8px;min-height:54px"><input type="radio" name="pm" ${i?'':'checked'} style="width:20px;min-height:0">${m}</label>`).join('')}
<button class="btn g" style="width:100%;margin-top:10px" onclick="pay(S.x.tot,'new')">Pay ${inr(x.tot)}</button><p style="text-align:center;font-size:12px;color:var(--mut);margin-top:8px">🔒 Test mode, no real money charged</p></div></div>`}
function pay(amt,kind,ext){document.querySelectorAll('.ov').forEach(o=>o.remove());const o=overlay(`<div style="text-align:center"><b style="color:var(--pl)">Checkout</b> <small>· Test mode, no real payment</small><h2 style="margin:8px 0">${inr(amt)}</h2><div class="spin"></div><p>Processing payment…</p></div>`);
setTimeout(()=>{o.remove();if(kind=='new'){const p=sp(S.id),h=S.dur>=720?10:S.dur,st=now()+H*2.25;cur={id:'PS-'+(48300+Math.floor(Math.random()*99)),sp:S.id,veh:S.vn,start:st,end:st+h*H,amt,st:'upcoming'};B.unshift(cur);confetti();go('confirm')}else{cur.end=Math.max(cur.end,now())+ext*60000;cur.free=(cur.free??100)-ext;cur.amt+=amt;S.pulse=1;confetti();toast('Parking extended successfully ✓');go('active')}},2000)}
function confirmV(){const p=sp(cur.sp);return `<div class="app" style="text-align:center"><svg class="ck" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M28 52L44 68L72 36"/></svg><h2>Your parking is reserved!</h2><p style="color:var(--mut)">Booking ${cur.id}</p>
<div class="card pad" style="margin:14px 16px;text-align:left;animation:pg .6s both"><b>${p[1]}</b><div style="color:var(--mut);font-size:14px">${p[3]}, Bengaluru</div><div class="line"><span>${D(cur.start)}</span><span>${T(cur.start)} – ${T(cur.end)}</span></div><div class="line"><span>Vehicle</span><span>${cur.veh}</span></div><div style="text-align:center;margin-top:8px">${qr(cur.id+'|'+p[1])}</div><div id="cd" style="text-align:center;font-weight:700;color:var(--pl);margin-top:10px"></div></div>
<div style="display:grid;gap:8px;padding:0 16px"><button class="btn" onclick="navigate(${cur.sp})">🧭 Navigate with Google Maps</button><button class="btn r" onclick="cancel()">Cancel booking</button><button class="btn g" onclick="S.nav='bookings';go('bookings')">View my bookings</button></div></div>`}
function cancel(){cur.st='cancelled';toast('Booking cancelled — refund initiated','#DC2626');S.tab='Cancelled';S.nav='bookings';go('bookings')}
 
function active(){const p=sp(cur.sp),tot=cur.end-cur.start;return `<div class="app" style="text-align:center"><div class="hd"><button class="back" onclick="go('bookings')">←</button><b style="text-align:left">Active booking</b></div>
<div id="bn"></div><h3>${p[1]}</h3><p style="color:var(--mut);font-size:14px">${p[3]}, Bengaluru</p><div style="margin:6px 0">${pill(cur.st=='checked'?'checked':'active')}</div>
<div class="ringw ${S.pulse?'ok':''}" id="rw"><svg width="200" height="200"><circle cx="100" cy="100" r="88" stroke="var(--bd)" stroke-width="12" fill="none"/><circle id="rg" cx="100" cy="100" r="88" stroke="var(--acc)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="553" style="transition:stroke-dashoffset 1s linear,stroke .4s"/></svg><div class="c"><div><span id="tm">--</span><small style="display:block;font-size:12px;color:var(--mut);font-weight:500">ends ${T(cur.end)}</small></div></div></div>
${qr(cur.id,cur.st=='checked'?'scan':'')}<div style="color:var(--mut);font-size:13px;margin:8px 0">${D(cur.start)} · ${T(cur.start)}–${T(cur.end)} · ${cur.veh} · ${inr(cur.amt)}</div>
<div style="display:grid;gap:8px;padding:0 16px"><button class="btn" onclick="navigate(${cur.sp})">🧭 Navigate with Google Maps</button>${cur.st=='checked'?'<button class="btn w" onclick="photo(\'out\')">Check out</button>':'<button class="btn g" onclick="photo(\'in\')">📷 I have arrived</button>'}<button class="btn o" onclick="extend()">⏱ Extend parking</button><button class="btn r" onclick="cancel()">Cancel booking</button><button class="chip" onclick="cur.end=now()+9.5*6e4;go('active')">Demo: 10 min left</button><button class="chip" onclick="cur.end=now()-3*6e4;go('active')">Demo: time is up</button></div></div>`}
function startTimer(){const tot=cur.end-cur.start;const f=()=>{const r=Math.max(0,cur.end-now()),m=Math.floor(r/6e4),s=Math.floor(r/1e3)%60,tm=$('#tm');if(!tm)return;tm.textContent=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}:${String(s).padStart(2,'0')}`;const rg=$('#rg');rg.style.strokeDashoffset=553*(1-r/tot);const w=r<10*6e4;rg.style.stroke=w?'#F59E0B':'#16A34A';$('#rw').classList.toggle('warn',w);$('#bn').innerHTML=w?`<div class="banner">⏰ Your parking ends in ${Math.max(1,m)} minutes. Extend or check out. <button class="chip" onclick="extend()">Extend</button></div>`:''};f();tick=setInterval(f,1000)}
function photo(k){const o=overlay(`<h3>${k=='in'?'Check-in photo':'Check-out photo'}</h3><p style="color:var(--mut);margin:6px 0 14px">Take a photo of your vehicle in the space.</p><input type="file" accept="image/*" capture="environment" id="ph"><button class="btn g" style="width:100%;margin-top:12px" id="go">Continue</button><button class="chip" style="margin-top:10px" id="sk">Skip (demo)</button>`);const run=()=>{o.firstChild.innerHTML=`<div style="text-align:center"><div class="spin"></div><b>${k=='in'?'Checking in…':'Checking out…'}</b></div>`;setTimeout(()=>{o.remove();if(k=='in'){cur.st='checked';toast('Checked in successfully');go('active')}else{cur.st='completed';go('done')}},1500)};$('#go').onclick=run;$('#sk').onclick=run}
